name: Prepare builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - "Makefile"
      - "configs/**"
      - "package/**"
      - "scripts/**"
      - ".github/workflows/prepare-builds.yml"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Knulli build container
        run: make build-docker-image
