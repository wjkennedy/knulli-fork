name: Prepare builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target (matches knulli-*.board name suffix)"
        required: true
        default: "h700"
  pull_request:
    paths:
      - "Dockerfile"
      - "Makefile"
      - "configs/**"
      - "package/**"
      - "scripts/**"
      - ".github/workflows/prepare-builds.yml"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Knulli build container
        run: make build-docker-image

      - name: Build Knulli firmware image
        if: github.event_name == 'workflow_dispatch'
        env:
          BATCH_MODE: 1
          PARALLEL_BUILD: 1
          TARGET: ${{ github.event.inputs.target || 'h700' }}
        run: make "${TARGET}-build"

      - name: Upload firmware artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: knulli-${{ github.event.inputs.target || 'h700' }}-images
          path: output/${{ github.event.inputs.target || 'h700' }}/images/knulli/images/${{ github.event.inputs.target || 'h700' }}
