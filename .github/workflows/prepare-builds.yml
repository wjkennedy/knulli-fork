name: Prepare builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target (matches knulli-*.board name suffix)"
        required: true
        default: "h700"
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event.inputs.target || 'h700' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Knulli build container
        run: make build-docker-image

      - name: Build Knulli firmware image
        env:
          BATCH_MODE: 1
          PARALLEL_BUILD: 1
        continue-on-error: true
        run: make "${TARGET}-build"

      - name: Check for firmware artifacts
        id: artifacts
        run: |
          if [ -d "output/${TARGET}/images/knulli/images/${TARGET}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        if: steps.artifacts.outputs.found == 'true'
        with:
          name: knulli-${{ env.TARGET }}-images
          path: output/${{ env.TARGET }}/images/knulli/images/${{ env.TARGET }}
